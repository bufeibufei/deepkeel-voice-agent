[project]
name = "deepkeel-voice-travel-agent"
version = "0.1.0"
description = "Streaming Chinese voice travel agent powered by DeepKeel and MCP"
requires-python = ">=3.12"
dependencies = [
  "deepkeel @ git+https://github.com/bufeibufei/deepkeel.git@v4.1.0",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx[socks]>=0.28,<1",
  "websockets>=15,<16",
  "python-dotenv>=1.1,<2",
  "pydantic-settings>=2.10,<3",
  "mcp>=1.15,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
