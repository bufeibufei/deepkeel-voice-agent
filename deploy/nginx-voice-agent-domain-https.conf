server {
    listen 8443 ssl http2;
    server_name voice-agent.8.162.12.47.nip.io;

    ssl_certificate /etc/nginx/ssl/deepkeel-voice-agent/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/deepkeel-voice-agent/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VOICE_AGENT_SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/deepkeel-voice-agent.conf;

    location / {
        return 302 /voice-agent/;
    }
}
