server {
    listen 80;
    server_name voice-agent.8.162.12.47.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    include /etc/nginx/snippets/deepkeel-voice-agent.conf;

    location / {
        return 302 /voice-agent/;
    }
}
